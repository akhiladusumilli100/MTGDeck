<div style="position: fixed; top: 10px; right: 10px;">
  {% if user.is_authenticated %}
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" style="display: inline;">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}{% if request.path != '/accounts/login/' and request.path != '/accounts/signup/' %}?next={{ request.get_full_path|urlencode }}{% endif %}">Log in</a> | <a href="{% url 'signup' %}">Sign up</a>
  {% endif %}
</div>
