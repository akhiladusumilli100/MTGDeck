<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ deck.name }}</title>
</head>
<body>
  <p><a href="{% url 'saved_decks' %}">&larr; Saved Decks</a></p>
  <h1>{{ deck.name }}</h1>
  <p>Commander: {{ commander }}</p>

  {% for group in card_groups %}
    <h3 style="margin-bottom: 0;">{{ group.name }}</h3>
    <ul style="list-style: none; padding-left: 0; margin-top: 0;">
      {% for entry in group.cards %}
        <li>- {{ entry.card }}</li>
      {% endfor %}
    </ul>
  {% endfor %}
</body>
</html>
