<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saved Decks</title>
</head>
<body>
  <p><a href="{% url 'deck_builder' %}">&larr; Deck Builder</a></p>
  <h1>Saved Decks</h1>
  <ul>
    {% for deck in decks %}
      <li>
        <a href="{% url 'deck_detail' deck.pk %}">{{ deck.name }}</a>
        <form method="post" action="{% url 'delete_deck' deck.pk %}" style="display: inline;">
          {% csrf_token %}
          <button type="submit">Delete</button>
        </form>
      </li>
    {% empty %}
      <li>No saved decks.</li>
    {% endfor %}
  </ul>
</body>
</html>
